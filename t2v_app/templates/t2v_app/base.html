<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}T2V Bot - Text to Video Generator{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="{% url 't2v_app:index' %}" class="logo">T2V Bot</a>
            <div class="nav-links">
                <a href="{% url 't2v_app:index' %}">Generate</a>
                <a href="{% url 't2v_app:dashboard' %}">Dashboard</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>T2V Bot - Experiment with Text-to-Video using Django, Ollama, HTML & JavaScript</p>
        </div>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
